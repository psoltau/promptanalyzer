[project]
name = "promptanalyzer"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.128",
    "uvicorn[standard]>=0.39",
    "httpx>=0.28",
    "pydantic>=2.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "import-linter>=2.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
